# Helmsman: cgroupfs driver to match containerd (no systemd).
# Lives in /etc (read-only OS); /var/lib/kubelet is runtime state only.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: cgroupfs
containerRuntimeEndpoint: unix:///run/containerd/containerd.sock
staticPodPath: /etc/kubernetes/manifests
failSwapOn: false
# Standalone (not joined; see helmsman-join): no webhook auth is possible, so the
# kubelet API is open but bound to localhost only. Joined nodes use kubelet-cluster.yaml.
address: 127.0.0.1
authentication:
  anonymous:
    enabled: true
  webhook:
    enabled: false
authorization:
  mode: AlwaysAllow
